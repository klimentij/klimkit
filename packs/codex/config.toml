model = "gpt-5.5"
model_reasoning_effort = "xhigh"
personality = "pragmatic"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
enabled = false

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]
enabled = false

[features]
multi_agent = true
codex_hooks = true

[plugins."github@openai-curated"]
enabled = true
