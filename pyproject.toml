[project]
name = "klimkit"
version = "0.1.3"
description = "Agentic engineering across machines, under control."
requires-python = ">=3.11"
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
klimkit = "klimkit.cli:main"
kk = "klimkit.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klimkit"]
